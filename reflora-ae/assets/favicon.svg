<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="refBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="refGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Tile -->
  <rect width="512" height="512" rx="128" fill="url(#refBg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(163,230,53,0.3)" stroke-width="6" />

  <!-- Stylized Seedling / Sprout / Leaf of Semiárido -->
  <path d="M256 400 C256 320 256 220 256 160 C256 100 360 90 390 140 C420 190 360 270 256 310" 
        fill="url(#leafGrad)" opacity="0.95" filter="url(#refGlow)" />
        
  <path d="M256 400 C256 330 256 250 256 210 C256 160 160 150 130 190 C100 230 150 300 256 330" 
        fill="url(#leafGrad)" opacity="0.8" />

  <!-- Stem & Soil Arc -->
  <path d="M 256 410 L 256 170" stroke="#A3E635" stroke-width="20" stroke-linecap="round" />
  <circle cx="256" cy="415" r="24" fill="#A3E635" />
</svg>