<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5D17" />
      <stop offset="100%" stop-color="#ED4800" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Code Bracket Left (White / Emerald) -->
  <path d="M 170 160 L 95 256 L 170 352" fill="none" stroke="url(#neonGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Code Bracket Right (Emerald / Neon) -->
  <path d="M 342 160 L 417 256 L 342 352" fill="none" stroke="url(#neonGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Central Nexus 'N' and 'X' in Tech Orange -->
  <!-- N Letter -->
  <path d="M 200 340 L 200 172 L 255 265 L 255 172" fill="none" stroke="url(#orangeGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Impact Dot / Core Node -->
  <circle cx="305" cy="180" r="16" fill="#ED4800" />
  <!-- Dynamic slash / connection -->
  <line x1="265" y1="230" x2="315" y2="340" stroke="url(#orangeGrad)" stroke-width="30" stroke-linecap="round" />
</svg>